<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omnichannel AI Agent Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 border-r border-slate-800 bg-slate-900/50 p-6 flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 mb-8">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">AI</div>
        <h1 class="text-xl font-bold tracking-tight">OmniAgent</h1>
      </div>
      <nav class="space-y-2">
        <button onclick="switchTab('inbox')" id="btn-inbox" class="w-full text-left px-4 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-medium">📥 Unified Leads</button>
        <button onclick="switchTab('simulator')" id="btn-simulator" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white font-medium">⚡ Ingestion Simulator</button>
        <button onclick="switchTab('bulk')" id="btn-bulk" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white font-medium">📢 Bulk Outbound</button>
      </nav>
    </div>
    <div class="border-t border-slate-800 pt-4 text-xs text-slate-500">
      Status: <span class="text-emerald-400 font-semibold">● Localhost Active</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8 overflow-y-auto">
    
    <!-- Top KPI Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Total Leads Handled</p>
        <h2 id="metric-total-leads" class="text-2xl font-bold mt-1">0</h2>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">IndiaMART / B2B</p>
        <h2 id="metric-indiamart" class="text-2xl font-bold mt-1 text-amber-400">0</h2>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Social (IG, FB, YT)</p>
        <h2 id="metric-social" class="text-2xl font-bold mt-1 text-pink-400">0</h2>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Outbound Broadcasts</p>
        <h2 id="metric-campaigns" class="text-2xl font-bold mt-1 text-emerald-400">0</h2>
      </div>
    </div>

    <!-- VIEW 1: UNIFIED INBOX -->
    <section id="view-inbox" class="space-y-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xl font-bold">Inbound Channel Stream & AI Auto-Replies</h2>
        <button onclick="loadData()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">🔄 Refresh Feed</button>
      </div>
      <div id="leads-container" class="space-y-3">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- VIEW 2: SIMULATOR / TESTING INGESTION -->
    <section id="view-simulator" class="hidden max-w-2xl bg-slate-900 border border-slate-800 p-6 rounded-xl">
      <h2 class="text-xl font-bold mb-4">Simulate Inbound Event</h2>
      <p class="text-sm text-slate-400 mb-6">Test how the AI Agent auto-handles and replies to specific platforms.</p>
      
      <form id="sim-form" onsubmit="handleSimulate(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Source Channel</label>
          <select id="sim-source" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm">
            <option value="indiamart">IndiaMART Wholesale Inquiry</option>
            <option value="instagram">Instagram Comment / DM</option>
            <option value="facebook">Facebook Lead Ad</option>
            <option value="gmail">Gmail Inbound Message</option>
            <option value="youtube">YouTube Video Comment</option>
            <option value="website">Website Live Form / Chat</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Sender Name</label>
          <input type="text" id="sim-name" required placeholder="e.g. Ramesh Kumar" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contact Info (Phone/Email)</label>
          <input type="text" id="sim-contact" required placeholder="+91 9876543210 or lead@gmail.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Query / Message</label>
          <textarea id="sim-query" required rows="3" placeholder="What is the price for bulk 500 units?" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm"></textarea>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-semibold text-sm">Process Through AI Agent</button>
      </form>
    </section>

    <!-- VIEW 3: BULK CAMPAIGN DISPATCHER -->
    <section id="view-bulk" class="hidden max-w-2xl bg-slate-900 border border-slate-800 p-6 rounded-xl">
      <h2 class="text-xl font-bold mb-4">Bulk Outbound Marketing</h2>
      <form id="bulk-form" onsubmit="handleBroadcast(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Target Channel</label>
          <select id="bulk-channel" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm">
            <option value="whatsapp">Bulk WhatsApp (Cloud API)</option>
            <option value="sms">Bulk SMS (DLT Gateway)</option>
            <option value="email">Bulk Email (Nurture Sequence)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Target Recipients (Comma Separated)</label>
          <input type="text" id="bulk-recipients" required placeholder="+919876543210, +919898989898" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Campaign Copy</label>
          <textarea id="bulk-message" required rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm">Hi there! Exclusive 20% discount on all orders today. Explore our catalog directly here: https://mywebsite.com/flash-sale</textarea>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-semibold text-sm">Launch Outbound Broadcast</button>
      </form>
    </section>

  </main>

  <script>
    function switchTab(tab) {
      ['inbox', 'simulator', 'bulk'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`btn-${t}`).className = "w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white font-medium";
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-${tab}`).className = "w-full text-left px-4 py-2.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-medium";
    }

    async function loadData() {
      // Fetch Stats
      const statsRes = await fetch('/api/stats');
      const stats = await statsRes.json();
      document.getElementById('metric-total-leads').innerText = stats.total_leads;
      document.getElementById('metric-indiamart').innerText = stats.sources.indiamart;
      document.getElementById('metric-social').innerText = stats.sources.instagram + stats.sources.facebook + stats.sources.youtube;
      document.getElementById('metric-campaigns').innerText = stats.total_broadcasts;

      // Fetch Leads
      const leadsRes = await fetch('/api/leads');
      const leads = await leadsRes.json();
      const container = document.getElementById('leads-container');
      
      if (leads.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 border border-dashed border-slate-800 rounded-xl">No incoming leads yet. Use the simulator or send webhooks.</div>`;
        return;
      }

      container.innerHTML = leads.map(l => `
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <span class="inline-block text-xs uppercase px-2 py-0.5 rounded font-bold ${
                l.source === 'indiamart' ? 'bg-amber-500/20 text-amber-400' :
                l.source === 'instagram' ? 'bg-pink-500/20 text-pink-400' :
                l.source === 'gmail' ? 'bg-blue-500/20 text-blue-400' : 'bg-slate-700 text-slate-300'
              }">${l.source}</span>
              <span class="text-slate-300 font-semibold ml-2">${l.sender_name}</span>
              <span class="text-xs text-slate-500 ml-1">(${l.contact_info})</span>
            </div>
            <span class="text-xs text-slate-500">${l.created_at}</span>
          </div>
          <div class="text-sm bg-slate-950 p-3 rounded-lg border border-slate-800/60">
            <span class="text-xs font-semibold text-slate-400 block mb-1">Inquiry:</span>
            ${l.query}
          </div>
          <div class="text-sm bg-indigo-950/30 border border-indigo-900/40 p-3 rounded-lg text-indigo-200">
            <span class="text-xs font-bold text-indigo-400 block mb-1">🤖 AI Auto-Action:</span>
            ${l.ai_reply}
            <div class="mt-2 text-xs">
              <span class="text-slate-400 font-semibold">Directing to Website:</span> 
              <a href="${l.landing_url}" target="_blank" class="text-indigo-400 underline">${l.landing_url}</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function handleSimulate(e) {
      async function handleSimulate(e) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = "Processing with AI Agent...";
      submitBtn.disabled = true;
      }

      try {
        const payload = {
          source: document.getElementById('sim-source').value,
          name: document.getElementById('sim-name').value,
          contact: document.getElementById('sim-contact').value,
          query: document.getElementById('sim-query').value
        };

        const res = await fetch('/api/webhook/ingest', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.detail || `Server returned ${res.status}`);
        }

        document.getElementById('sim-query').value = '';
        switchTab('inbox');
        await loadData();
      } catch (err) {
        alert("Error: " + err.message);
        console.error(err);
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    }

    async function handleBroadcast(e) {
      e.preventDefault();
      const recipients = document.getElementById('bulk-recipients').value.split(',');
      const payload = {
        channel: document.getElementById('bulk-channel').value,
        recipients: recipients,
        template_message: document.getElementById('bulk-message').value
      };
      await fetch('/api/campaigns/broadcast', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      alert(`Broadcast sent to ${recipients.length} recipients!`);
      loadData();
    }

    // Auto load on start
    loadData();
  </script>
</body>
</html>
